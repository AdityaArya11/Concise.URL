services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_MODE=memory        # switch to 'mongo' + set MONGO_URI once you have a real database
      - CACHE_MODE=redis
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-this-to-a-long-random-string-in-production
      - JWT_EXPIRES_IN=7d
      - APP_BASE_URL=http://localhost:4000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
